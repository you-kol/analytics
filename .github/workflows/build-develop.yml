name: Build and Push Dev Images

on:
  push:
    branches: [develop, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/you-kol
  PLATFORMS: linux/arm64

jobs:
  build:
    runs-on: self-hosted
    concurrency:
      group: build-develop-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: app
            image: analytics-app
            context: .
            file: ./Dockerfile
          - id: capture
            image: analytics-capture
            context: rust
            file: rust/Dockerfile
            build_args: |
              BIN=capture
          - id: property-defs-rs
            image: analytics-property-defs-rs
            context: rust
            file: rust/Dockerfile
            build_args: |
              BIN=property-defs-rs
          - id: feature-flags
            image: analytics-feature-flags
            context: rust
            file: rust/Dockerfile
            build_args: |
              BIN=feature-flags
          - id: cyclotron-janitor
            image: analytics-cyclotron-janitor
            context: rust
            file: rust/Dockerfile
            build_args: |
              BIN=cyclotron-janitor
          - id: livestream
            image: analytics-livestream
            context: livestream
            file: livestream/Dockerfile
          - id: mcp
            image: analytics-mcp
            context: products/mcp
            file: products/mcp/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'Dockerfile'
              - 'posthog/**'
              - 'ee/**'
              - 'frontend/**'
              - 'plugin-server/**'
              - 'products/**'
              - 'common/**'
              - 'bin/**'
              - 'patches/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'manage.py'
            rust:
              - 'rust/**'
            livestream:
              - 'livestream/**'
            mcp:
              - 'products/mcp/**'

      - name: Compute prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 'v0.0.0')
          commits=$(git log --format=%s ${last_tag}..HEAD || true)
          bump=patch
          if echo "$commits" | grep -E '(^feat\b|BREAKING CHANGE|!\:)' >/dev/null; then bump=minor; fi
          if echo "$commits" | grep -E '(BREAKING CHANGE|!\:)' >/dev/null; then bump=major; fi
          IFS='.' read -r M m p <<<"$(echo $last_tag | sed 's/^v//;s/\./ /g')"; M=${M:-0}; m=${m:-0}; p=${p:-0}
          if [[ "$bump" == major ]]; then M=$((M+1)); m=0; p=0; elif [[ "$bump" == minor ]]; then m=$((m+1)); p=0; else p=$((p+1)); fi
          next="v${M}.${m}.${p}"
          pre="${next}-dev.${GITHUB_RUN_NUMBER}"
          echo "NEXT=${next}" >> $GITHUB_OUTPUT
          echo "PRE=${pre}" >> $GITHUB_OUTPUT
          echo "Using prerelease tag: ${pre}"

      - name: Build and Push
        id: build
        if: |
          (matrix.id == 'app' && steps.filter.outputs.app == 'true') ||
          (matrix.id == 'capture' && steps.filter.outputs.rust == 'true') ||
          (matrix.id == 'property-defs-rs' && steps.filter.outputs.rust == 'true') ||
          (matrix.id == 'feature-flags' && steps.filter.outputs.rust == 'true') ||
          (matrix.id == 'cyclotron-janitor' && steps.filter.outputs.rust == 'true') ||
          (matrix.id == 'livestream' && steps.filter.outputs.livestream == 'true') ||
          (matrix.id == 'mcp' && steps.filter.outputs.mcp == 'true')
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.version.outputs.PRE }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"


